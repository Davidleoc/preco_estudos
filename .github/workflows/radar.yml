name: Radar diário

on:
  schedule:
    - cron: "0 11 * * *"   # todo dia às 08:00 (horário de Brasília)
  workflow_dispatch:         # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rodar radar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          NOTIFICAR_SO_MUDANCAS: ${{ vars.NOTIFICAR_SO_MUDANCAS }}
          URL_PAGES: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python radar.py

      # Salva o estado (para comparar amanhã) e o relatório HTML no repositório.
      # O commit diário também mantém o agendamento ativo.
      - name: Salvar estado e relatório
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado/ docs/
          git diff --cached --quiet || git commit -m "radar: atualização $(date -u +%Y-%m-%d)"
          git push
